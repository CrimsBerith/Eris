name: Apple build and tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run ErisCore XCTest
        timeout-minutes: 5
        run: swift test --package-path Packages/ErisCore
      - name: Build macOS app
        run: xcodebuild -project Eris.xcodeproj -scheme ErisMac -configuration Debug build -quiet CODE_SIGNING_ALLOWED=NO
      - name: Build iOS simulator app
        run: xcodebuild -project Eris.xcodeproj -scheme ErisIOS -destination 'generic/platform=iOS Simulator' -configuration Debug build -quiet CODE_SIGNING_ALLOWED=NO
