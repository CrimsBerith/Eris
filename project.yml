name: Eris
options:
  bundleIdPrefix: com.alfagolab
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  defaultConfig: Debug

packages:
  ErisCore:
    path: Packages/ErisCore

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES

targets:
  ErisMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ErisMac
        excludes:
          - Resources
      - path: ErisMac/Resources/Assets.xcassets
        buildPhase: resources
      - path: ErisMac/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: ErisCore
    settings:
      base:
        PRODUCT_NAME: Eris
        PRODUCT_BUNDLE_IDENTIFIER: com.alfagolab.eris
        INFOPLIST_FILE: ErisMac/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_ENTITLEMENTS: ErisMac/Resources/ErisMac.entitlements

  ErisIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ErisIOS
        excludes:
          - Resources
      - path: ErisIOS/Resources/Assets.xcassets
        buildPhase: resources
      - path: ErisIOS/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: ErisCore
    settings:
      base:
        PRODUCT_NAME: ErisIOS
        PRODUCT_BUNDLE_IDENTIFIER: com.alfagolab.eris.ios
        INFOPLIST_FILE: ErisIOS/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: ErisIOS/Resources/ErisIOS.entitlements
